# Netlify deployment configuration for Neon Snake
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "next build"
  publish = ".next"

# The official Next.js runtime handles SSR/SSG routes, static assets
# and caching. It is auto-installed by Netlify during the build.
[[plugins]]
  package = "@netlify/plugin-nextjs"
