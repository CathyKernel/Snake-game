<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13294b"/>
      <stop offset="1" stop-color="#070f1f"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色霓虹竞技场背景 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 微弱的网格点 -->
  <g fill="#1e3a5f" opacity="0.5">
    <circle cx="8" cy="8" r="1.1"/>
    <circle cx="32" cy="8" r="1.1"/>
    <circle cx="56" cy="8" r="1.1"/>
    <circle cx="8" cy="32" r="1.1"/>
    <circle cx="56" cy="32" r="1.1"/>
    <circle cx="8" cy="56" r="1.1"/>
    <circle cx="32" cy="56" r="1.1"/>
    <circle cx="56" cy="56" r="1.1"/>
  </g>

  <!-- 霓虹蛇身（S 形走向）+ 苹果，带发光效果 -->
  <g filter="url(#glow)">
    <path d="M 14 18 H 50 V 30 H 16 V 42 H 42"
          fill="none" stroke="url(#snake)" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="18" r="7.5" fill="#a7f3d0"/>
    <circle cx="50" cy="52" r="5" fill="#ef4444"/>
    <circle cx="48.4" cy="50.4" r="1.4" fill="#fca5a5" opacity="0.9"/>
  </g>

  <!-- 蛇眼 -->
  <circle cx="11" cy="15.2" r="1.6" fill="#070f1f"/>
  <circle cx="11" cy="20.8" r="1.6" fill="#070f1f"/>

  <!-- 苹果梗 -->
  <path d="M 50 47.2 L 50 45" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round"/>
</svg>
